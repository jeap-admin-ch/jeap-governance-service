jeap.governance.reporting.enabled=true
# Runs at 55 by default, as :15 is the default window for the data import job, and :00 and :00:45 is the default window for the scoring job
jeap.governance.reporting.cron-expression=0 55 6-20 * * MON-FRI
jeap.governance.reporting.orphancleanup.cron-expression=0 10 3 * * MON-FRI
jeap.governance.reporting.lock-at-least=PT1M
jeap.governance.reporting.lock-at-most=PT20M

jeap.governance.reporting.trendPeriodDays=30
